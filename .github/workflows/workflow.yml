name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-node:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run build --if-present
      - run: npm test

  test-bun:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3", "latest"]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Use Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun test

  test-deno:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        deno-version: [v2.1.5, latest]

    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - name: Use Deno ${{ matrix.deno-version }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - run: bun install --frozen-lockfile
      - run: deno task test --testPathIgnorePatterns=cli/tests

  test-browser:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run build --if-present
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:browser -- --browser.name=${{ matrix.browser }}

  test-chrome-without-fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - name: Use latest Chromium
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: latest
          install-dependencies: true
      - run: bun install --frozen-lockfile
      - run: npm run build --if-present
      - run: bun run test:browser -- --browser.name=chromium
        env:
          VITEST_CHROME_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          VITE_API_DEF_DISABLE_FETCH: "true"
